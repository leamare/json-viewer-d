name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev file
      - run: dub build -b release --compiler=ldc2
      - run: dub test --compiler=ldc2
      - name: package
        run: |
          strip bin/jsonview
          mkdir out
          tar -czf out/jsonview-linux-${{ matrix.arch }}.tar.gz -C bin jsonview

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp bin/jsonview AppDir/usr/bin/
          cp dist/jsonview.desktop AppDir/
          cp dist/jsonview.desktop AppDir/usr/share/applications/
          cp dist/jsonview.png AppDir/
          cp dist/jsonview.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ln -s usr/bin/jsonview AppDir/AppRun

          curl -sLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run AppDir out/jsonview-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - run: dub build -b release --compiler=ldc2
      - run: dub test --compiler=ldc2
      - run: |
          mkdir out
          Compress-Archive -Path bin/jsonview.exe -DestinationPath out/jsonview-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - run: dub build -b release --compiler=ldc2
      - run: dub test --compiler=ldc2
      - run: |
          strip bin/jsonview
          codesign --force --sign - bin/jsonview
          mkdir out
          tar -czf out/jsonview-macos-arm64.tar.gz -C bin jsonview

          app="dmg/JSON Viewer.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp bin/jsonview "$app/MacOS/"
          cp dist/Info.plist "$app/"
          cp dist/jsonview.icns "$app/Resources/"
          codesign --force --deep --sign - "dmg/JSON Viewer.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "JSON Viewer" -srcfolder dmg -format UDZO out/jsonview-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
